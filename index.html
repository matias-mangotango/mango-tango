<script>
const SUPABASE_URL = 'https://tiedxprzbdtrzzycgyff.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpZWR4cHJ6YmR0cnp6eWNneWZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MTk5MzksImV4cCI6MjA5MzE5NTkzOX0.4pda6N9jHPPCpwX2Vvw6mmUS3pxpQcrp4mTx5Eeqf_w';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null, currentView = 'dashboard', modal = null;
let cache = { sellers:[], clients:[], fees:[], payments:[], history:[] };

// ── HELPERS ───────────────────────────────────────────────
function fmtARS(n){ return '$' + Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function fmtUSD(n){ return 'U$S ' + Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('es-AR') : '—'; }
function fmtDateTime(d){ return d ? new Date(d).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '—'; }
function today(){ return new Date().toISOString().slice(0,10); }

function fmtPayAmt(pay){
  if(!pay) return '—';
  if(pay.currency==='usd') return fmtUSD(pay.usd_amount);
  return fmtARS(pay.ars_amount)+' ARS';
}
function fmtPayDetail(pay){
  if(!pay) return '—';
  if(pay.currency==='usd') return fmtUSD(pay.usd_amount);
  return fmtARS(pay.ars_amount)+' (TC $'+pay.tc_value+')';
}

function getSellerClients(sid){ return cache.clients.filter(c=>c.seller_id===sid); }
function getMonthFees(sid,month){ const ids=getSellerClients(sid).map(c=>c.id); return cache.fees.filter(f=>f.month===month&&ids.includes(f.client_id)); }
function calcUnpaidBonusGroups(sid){
  const seller=cache.sellers.find(s=>s.id===sid)||{};
  return Math.max(0, Math.floor(getSellerClients(sid).length/3) - (seller.paid_bonus_groups||0));
}
function getPayment(ref){ return cache.payments.find(p=>p.ref===ref); }
function getSellerStats(sid){
  const clients=getSellerClients(sid);
  const active=clients.filter(c=>c.status==='active');
  const allFees=cache.fees.filter(f=>clients.map(c=>c.id).includes(f.client_id));
  const recurringPaid=allFees.filter(f=>f.paid).reduce((s,f)=>s+f.amount*.05,0);
  const pendingRecurringARS=allFees.filter(f=>!f.paid).reduce((s,f)=>s+f.amount*.05,0);
  const closingUnpaidCount=clients.filter(c=>!c.closing_paid).length;
  return { activeClients:active.length, totalClients:clients.length, recurringPaid, pendingRecurringARS, closingUnpaidCount };
}

// ── DB ────────────────────────────────────────────────────
async function dbLoadAll(){
  const [s,u,c,f,p,h] = await Promise.all([
    sb.from('sellers').select('*').order('created_at'),
    sb.from('users').select('*'),
    sb.from('clients').select('*').order('created_at'),
    sb.from('fees').select('*').order('month'),
    sb.from('payments').select('*').order('created_at'),
    sb.from('history').select('*').order('created_at',{ascending:false}).limit(300),
  ]);
  cache.sellers=s.data||[]; cache.users=u.data||[]; cache.clients=c.data||[];
  cache.fees=f.data||[]; cache.payments=p.data||[]; cache.history=h.data||[];
}
async function dbAddHistory(type,desc,sellerId=null,paymentRef=null){
  const {data}=await sb.from('history').insert({type,description:desc,seller_id:sellerId||null,payment_ref:paymentRef||null}).select().single();
  if(data) cache.history.unshift(data);
  return data;
}

// ── RENDER ENGINE ─────────────────────────────────────────
function h(tag,attrs,...children){
  const el=document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==='className') el.className=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='checked'||k==='disabled') el[k]=v;
    else el.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(c=>{
    if(c==null||c===false) return;
    el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);
  });
  return el;
}
function showLoading(msg='Cargando...'){
  document.getElementById('app').innerHTML='';
  document.getElementById('app').appendChild(h('div',{className:'loading-screen'},h('div',{className:'spinner'}),h('span',{},msg)));
}
function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  if(!currentUser){ app.appendChild(renderLogin()); return; }
  app.appendChild(renderApp());
}

// ── LOGIN ─────────────────────────────────────────────────
function renderLogin(){
  let errEl;
  const wrap=h('div',{className:'auth-wrap'},
    h('div',{className:'auth-card'},
      h('div',{className:'brand'},h('div',{className:'brand-icon'},'🥭'),h('h1',{},'Mango Tango'),h('p',{},'Sistema de Comisiones')),
      h('div',{className:'field'},h('label',{},'Email'),h('input',{type:'email',id:'le',placeholder:'tu@email.com'})),
      h('div',{className:'field'},h('label',{},'Contraseña'),h('input',{type:'password',id:'lp',placeholder:'••••••••',onKeydown:e=>{if(e.key==='Enter')doLogin();}})),
      errEl=h('div',{className:'err',style:'display:none'}),
      h('button',{className:'btn-primary',style:'margin-top:8px',id:'loginbtn',onClick:doLogin},'Ingresar')
    )
  );
  async function doLogin(){
    const email=document.getElementById('le').value.trim(), pass=document.getElementById('lp').value;
    const btn=document.getElementById('loginbtn'); btn.disabled=true; btn.textContent='Ingresando...';
    const {data,error}=await sb.from('users').select('*').eq('email',email.toLowerCase()).eq('password',pass).single();
    if(error||!data){ errEl.textContent='Email o contraseña incorrectos'; errEl.style.display='block'; btn.disabled=false; btn.textContent='Ingresar'; return; }
    currentUser=data; showLoading('Cargando datos...'); await dbLoadAll(); currentView='dashboard'; render();
  }
  return wrap;
}

// ── SHELL ─────────────────────────────────────────────────
function renderApp(){
  const isAdmin=currentUser.role==='admin';
  const adminNav=[{id:'dashboard',icon:'◻',label:'Resumen'},{id:'sellers',icon:'👤',label:'Vendedores'},{id:'clients',icon:'🏢',label:'Clientes'},{id:'fees',icon:'💵',label:'Facturación'},{id:'commissions',icon:'📊',label:'Comisiones'},{id:'history',icon:'📋',label:'Historial'}];
  // Seller: only "Mis comisiones" + "Historial"
  const sellerNav=[{id:'my-commissions',icon:'💵',label:'Mis comisiones'},{id:'history',icon:'📋',label:'Historial'}];
  const navItems=isAdmin?adminNav:sellerNav;
  // Default view for seller
  if(!isAdmin && currentView==='dashboard') currentView='my-commissions';

  const sidebar=h('div',{className:'sidebar'},
    h('div',{className:'sidebar-brand'},h('div',{className:'logo'},h('div',{className:'logo-icon'},'🥭'),h('span',{className:'logo-name'},'Mango Tango'))),
    ...navItems.map(n=>h('div',{className:'nav-item'+(currentView===n.id?' active':''),onClick:()=>{currentView=n.id;render();}},
      h('span',{style:'font-size:14px;width:16px;text-align:center;flex-shrink:0'},n.icon),h('span',{className:'label'},n.label)
    )),
    h('div',{className:'sidebar-footer'},
      h('div',{className:'user-chip'},
        h('div',{className:'avatar'},currentUser.name.slice(0,2).toUpperCase()),
        h('div',{className:'user-info'},h('div',{className:'user-name'},currentUser.name),h('div',{className:'user-role'},isAdmin?'Administrador':'Vendedor'))
      ),
      h('button',{className:'logout-btn',onClick:()=>{currentUser=null;cache={sellers:[],clients:[],fees:[],payments:[],history:[]};render();}},'Cerrar sesión')
    )
  );
  const main=h('div',{className:'main'},renderView());
  const layout=h('div',{className:'layout'},sidebar,main);
  const app=h('div',{className:'app'},layout);
  if(modal) app.appendChild(renderModal());
  return app;
}

function renderView(){
  const isAdmin=currentUser.role==='admin';
  if(currentView==='dashboard'&&isAdmin) return renderAdminDashboard();
  if(currentView==='sellers') return renderSellers();
  if(currentView==='clients') return renderClients();
  if(currentView==='fees') return renderFees();
  if(currentView==='commissions') return renderCommissions();
  if(currentView==='history') return renderHistory();
  if(currentView==='my-commissions') return renderMyCommissions();
  return renderMyCommissions();
}

// ── ADMIN DASHBOARD ───────────────────────────────────────
function renderAdminDashboard(){
  const curMonth=today().slice(0,7);
  const mrr=cache.fees.filter(f=>f.month===curMonth).reduce((s,f)=>s+f.amount,0);
  let pendingARS=0; cache.sellers.forEach(s=>{pendingARS+=getSellerStats(s.id).pendingRecurringARS;});
  return h('div',{},
    h('div',{className:'page-header'},h('h1',{className:'page-title'},'Panel General')),
    h('div',{className:'metric-grid'},
      metricCard('Vendedores',cache.sellers.length,''),
      metricCard('Clientes activos',cache.clients.filter(c=>c.status==='active').length,'green'),
      metricCard('Facturación del mes',fmtARS(mrr),'green'),
      metricCard('Comisiones ARS pendientes',fmtARS(pendingARS),'amber'),
    ),
    h('div',{className:'card'},
      h('div',{className:'flex items-center justify-between mb-2'},
        h('p',{className:'section-title',style:'margin:0'},'Vendedores'),
        h('button',{className:'btn btn-green btn-sm',onClick:()=>openModal('add-seller')},'+ Nuevo vendedor')
      ),
      cache.sellers.length===0?h('div',{className:'empty-state'},'No hay vendedores aún.')
      :h('div',{className:'table-wrap'},h('table',{},
        h('thead',{},h('tr',{},th('Vendedor'),th('Clientes'),th('Cierres USD pendientes'),th('Comisiones ARS pendientes'),th(''))),
        h('tbody',{},...cache.sellers.map(s=>{
          const st=getSellerStats(s.id);
          return h('tr',{},
            td(h('div',{className:'flex items-center gap-2'},h('div',{className:'avatar',style:'width:26px;height:26px;font-size:10px'},s.name.slice(0,2).toUpperCase()),h('span',{},s.name))),
            td(st.activeClients+' activos / '+st.totalClients+' total'),
            td(h('span',{style:'color:#BA7517;font-weight:600'},st.closingUnpaidCount+' pendiente'+(st.closingUnpaidCount===1?'':'s'))),
            td(h('span',{style:'color:#BA7517;font-weight:600'},fmtARS(st.pendingRecurringARS))),
            td(h('button',{className:'btn btn-sm',onClick:()=>{currentView='commissions';render();}},'Ver detalle'))
          );
        }))
      ))
    )
  );
}

// ── SELLERS ───────────────────────────────────────────────
function renderSellers(){
  return h('div',{},
    h('div',{className:'page-header flex items-center justify-between'},
      h('div',{},h('h1',{className:'page-title'},'Vendedores')),

  const sf={val:''};
  const wrap=h('div',{},
    h('div',{className:'page-header flex items-center justify-between'},
      h('div',{},h('h1',{className:'page-title'},'Clientes')),
      h('button',{className:'btn btn-green',onClick:()=>openModal('add-client')},'+ Nuevo cliente')
    ),
    h('div',{className:'card'},
      h('div',{className:'flex gap-2 mb-2'},
        h('select',{className:'input',style:'max-width:200px',onChange:e=>{sf.val=e.target.value;refreshCT();}},
          h('option',{value:''},'Todos los vendedores'),
          ...cache.sellers.map(s=>h('option',{value:s.id},s.name))
        )
      ),

    const active=cls.filter(c=>c.status==='active'), inactive=cls.filter(c=>c.status!=='active');

      return h('tr',{},
        td(c.name),td(s?s.name:'—'),td(fmtDate(c.start_date)),
        td(c.status==='active'?h('span',{className:'badge badge-green'},'Activo'):h('span',{className:'badge badge-red'},'Inactivo')),
        td(c.closing_paid?h('span',{className:'badge badge-teal'},'Pagado'):h('span',{className:'badge badge-amber'},'Pendiente')),

          !c.closing_paid&&h('button',{className:'btn btn-sm btn-green',onClick:()=>openModal('pay-closing',c)},'Pagar cierre U$S')
        ))

      h('thead',{},h('tr',{},th('Cliente'),th('Vendedor'),th('Desde'),th('Estado'),th('Cierre USD'),th(''))),
      h('tbody',{},

// ── MODALS ────────────────────────────────────────────────
function openModal(type,data){ modal={type,data}; render(); }
function closeModal(){ modal=null; render(); }
function renderModal(){
  const overlay=h('div',{className:'modal-overlay',onClick:e=>{if(e.target===overlay)closeModal();}});
  let content;
  if(modal.type==='add-seller') content=modalAddSeller();
  else if(modal.type==='edit-seller') content=modalEditSeller(modal.data);
  else if(modal.type==='add-client') content=modalAddClient();
  else if(modal.type==='edit-client') content=modalEditClient(modal.data);
  else if(modal.type==='add-fee') content=modalAddFee(modal.data);
  else if(modal.type==='pay-fee') content=modalPayFee(modal.data);
  else if(modal.type==='pay-closing') content=modalPayClosing(modal.data);
  else if(modal.type==='pay-bonus') content=modalPayBonus(modal.data);
  else if(modal.type==='view-payment') content=modalViewPayment(modal.data);
  overlay.appendChild(content);
  return overlay;
}

// ── PAYMENT SECTION (comprobante adjunto) ─────────────────
function buildPaymentSection(pref){
  const fileInput=h('input',{type:'file',style:'display:none',accept:'image/*,.pdf',onChange:e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{pref.fileData=ev.target.result;pref.fileName=file.name;updatePreview();};
    reader.readAsDataURL(file);
  }});
  const preview=h('div',{style:'margin-top:6px'});
  function updatePreview(){
    preview.innerHTML='';
    if(pref.fileData) preview.appendChild(h('div',{className:'file-preview'},
      h('span',{},pref.fileData.startsWith('data:image')?'🖼':'📄'),
      h('span',{style:'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},pref.fileName),
      h('button',{className:'btn-link',style:'color:#e24b4a',onClick:()=>{pref.fileData=null;pref.fileName=null;updatePreview();}},'Quitar')
    ));
  }
  const notesInput=h('textarea',{className:'input',style:'resize:vertical;min-height:60px;margin-top:8px',placeholder:'Aclaraciones (opcional)...',onInput:e=>pref.notes=e.target.value});
  return h('div',{},
    h('hr',{className:'divider'}),
    h('p',{className:'text-sm text-muted',style:'margin-bottom:6px'},'Comprobante'),
    fileInput,
    h('div',{className:'file-drop',onClick:()=>fileInput.click()},'📎 Adjuntar imagen o PDF'),
    preview, notesInput
  );
}

// ── USD SECTION (simplified: USD default, ARS toggle) ─────
// Default = USD. Checkbox "Pagué en pesos" → shows TC field.
function buildUSDSection(pref, defaultUSD=true){
  pref.currency='usd'; pref.tc=''; pref.arsAmt='';
  const tcField=h('div',{className:'tc-field'},
    h('div',{className:'field',style:'margin-top:4px'},
      h('label',{},'Tipo de cambio (ARS por U$S)'),
      h('input',{className:'input',type:'number',placeholder:'Ej: 1200',onInput:e=>pref.tc=e.target.value})
    ),
    h('div',{className:'field'},
      h('label',{},'Monto en pesos ARS'),
      h('input',{className:'input',type:'number',placeholder:'Ej: 1500000',onInput:e=>pref.arsAmt=e.target.value})
    )
  );
  const checkbox=h('input',{type:'checkbox',onChange:e=>{
    const checked=e.target.checked;
    pref.currency=checked?'ars':'usd';
    tcField.style.display=checked?'block':'none';
  }});
  return h('div',{},
    h('div',{className:'ars-toggle'},
      checkbox,
      h('label',{style:'cursor:pointer'},'Pagué en pesos argentinos')
    ),
    tcField
  );
}

function resolveUSD(pref, errEl){
  if(pref.currency==='usd'){
    return {currency:'usd', usd_amount:null, tc_value:null, ars_amount:null};
    // usd_amount will be filled by caller if needed, or left null (just marks as USD paid)
  } else {
    if(!pref.tc||!pref.arsAmt){ if(errEl){errEl.textContent='Completá tipo de cambio y monto en pesos.';errEl.style.display='block';} return null; }
    return {currency:'ars', usd_amount:null, tc_value:parseFloat(pref.tc), ars_amount:parseFloat(pref.arsAmt)};
  }
}

// ── PAY CLOSING ───────────────────────────────────────────
function modalPayClosing(client){
  const pref={fileData:null,fileName:null,notes:'',currency:'usd',tc:'',arsAmt:''};
  const errEl=h('div',{className:'err',style:'display:none'});
  return h('div',{className:'modal'},
    h('h2',{},'Pagar bono por alta — '+client.name),
    h('div',{className:'receipt-box'},h('span',{className:'text-muted'},'Comisión de cierre en dólares (U$S)')),
    buildUSDSection(pref),
    buildPaymentSection(pref),
    errEl,
    h('div',{className:'modal-footer'},
      h('button',{className:'btn',onClick:closeModal},'Cancelar'),
      h('button',{className:'btn btn-green',id:'btn-pay-closing',onClick:async()=>{
        const amounts=resolveUSD(pref,errEl); if(!amounts) return;
        setBtnLoading('btn-pay-closing','Guardando...');
        const ref='closing_'+client.id;
        const {data:payData}=await sb.from('payments').insert({ref,type:'closing',...amounts,file_data:pref.fileData,file_name:pref.fileName,notes:pref.notes}).select().single();
        await sb.from('clients').update({closing_paid:true}).eq('id',client.id);
        const ci=cache.clients.findIndex(c=>c.id===client.id); if(ci>=0) cache.clients[ci].closing_paid=true;
        if(payData) cache.payments.push(payData);
        const amtStr=amounts.currency==='ars'?fmtARS(amounts.ars_amount)+' (TC $'+amounts.tc_value+')':'U$S (pagado en USD)';
        await dbAddHistory('payment','Cierre pagado: '+client.name+' — '+amtStr,client.seller_id,ref);
        closeModal();
      }},'Confirmar pago')
    )
  );
}

// ── PAY BONUS ─────────────────────────────────────────────
function modalPayBonus({seller}){
  const clients=getSellerClients(seller.id);
  const paidGroups=seller.paid_bonus_groups||0;
  const totalGroups=Math.floor(clients.length/3);
  const unpaidGroups=totalGroups-paidGroups;
  if(unpaidGroups<=0){ return h('div',{className:'modal'},h('h2',{},'Sin bonos pendientes'),h('div',{className:'modal-footer'},h('button',{className:'btn',onClick:closeModal},'Cerrar'))); }

  // Show which group we're paying (next unpaid)
  const groupIdx=paidGroups; // 0-based
  const groupClients=clients.slice(groupIdx*3,(groupIdx+1)*3);
  const pref={fileData:null,fileName:null,notes:'',currency:'usd',tc:'',arsAmt:''};
  const errEl=h('div',{className:'err',style:'display:none'});

  return h('div',{className:'modal'},
    h('h2',{},'Pagar bono 🎁 — Grupo '+(groupIdx+1)),
    h('div',{className:'receipt-box'},
      h('strong',{},'Vendedor: '),seller.name,h('br',{}),
      h('strong',{},'Clientes: '),groupClients.map(c=>c.name).join(', '),h('br',{}),
      h('span',{className:'text-xs text-muted'},'U$S 1.000 por grupo de 3 clientes')
    ),
    buildUSDSection(pref),
    buildPaymentSection(pref),
    errEl,
    h('div',{className:'modal-footer'},
      h('button',{className:'btn',onClick:closeModal},'Cancelar'),
      h('button',{className:'btn btn-green',id:'btn-pay-bonus',onClick:async()=>{
        const amounts=resolveUSD(pref,errEl); if(!amounts) return;
        setBtnLoading('btn-pay-bonus','Guardando...');
        const ref='bonus_'+seller.id+'_group_'+groupIdx;
        const {data:payData}=await sb.from('payments').insert({ref,type:'bonus',...amounts,file_data:pref.fileData,file_name:pref.fileName,notes:pref.notes}).select().single();
        const newPaidGroups=paidGroups+1;
        await sb.from('sellers').update({paid_bonus_groups:newPaidGroups}).eq('id',seller.id);
        const si=cache.sellers.findIndex(s=>s.id===seller.id); if(si>=0) cache.sellers[si].paid_bonus_groups=newPaidGroups;
        if(payData) cache.payments.push(payData);
        const amtStr=amounts.currency==='ars'?fmtARS(amounts.ars_amount)+' (TC $'+amounts.tc_value+')':'U$S (pagado en USD)';
        await dbAddHistory('bonus','Bono pagado a '+seller.name+' — Grupo '+(groupIdx+1)+' ('+groupClients.map(c=>c.name).join(', ')+') — '+amtStr,seller.id,ref);
        closeModal();
      }},'Confirmar pago')
    )
  );
}

// ── VIEW PAYMENT ──────────────────────────────────────────
function modalViewPayment(pay){
  return h('div',{className:'modal'},
    h('h2',{},'Comprobante de pago'),
    h('div',{className:'receipt-box',style:'display:flex;flex-direction:column;gap:4px'},
      h('p',{},h('strong',{},'Fecha: '),fmtDate(pay.created_at)),
      h('p',{},h('strong',{},'Monto: '),
        pay.currency==='usd'&&pay.usd_amount?fmtUSD(pay.usd_amount)
        :pay.currency==='ars'&&pay.ars_amount?fmtARS(pay.ars_amount)+' ARS (TC $'+pay.tc_value+')'
        :pay.currency==='usd'?'Pagado en U$S':'—'
      ),
      pay.notes&&h('p',{},h('strong',{},'Aclaraciones: '),pay.notes)
    ),
    pay.file_data
      ?h('div',{style:'margin-top:12px'},
          pay.file_data.startsWith('data:image')
            ?h('img',{src:pay.file_data,style:'max-width:100%;border-radius:8px;border:1px solid #eee'})
            :h('div',{className:'file-preview'},h('span',{},'📄'),h('span',{style:'flex:1'},pay.file_name||'Comprobante.pdf'),h('a',{href:pay.file_data,download:pay.file_name||'comprobante.pdf',className:'btn-link'},'Descargar'))
        )
      :h('div',{className:'empty-state',style:'padding:1.5rem'},'Sin archivo adjunto.'),
    h('div',{className:'modal-footer'},h('button',{className:'btn',onClick:closeModal},'Cerrar'))
  );
}

// ── CRUD MODALS ───────────────────────────────────────────
function modalAddSeller(){
  let name='',email='',pass='',phone='';
  const errEl=h('div',{className:'err',style:'display:none'});
  return h('div',{className:'modal'},
    h('h2',{},'Nuevo vendedor'),
    h('div',{className:'field'},h('label',{},'Nombre completo'),h('input',{className:'input',placeholder:'Juan García',onInput:e=>name=e.target.value})),
    h('div',{className:'field'},h('label',{},'Email (para login)'),h('input',{className:'input',type:'email',placeholder:'juan@email.com',onInput:e=>email=e.target.value})),
    h('div',{className:'field'},h('label',{},'Contraseña'),h('input',{className:'input',placeholder:'mínimo 6 caracteres',onInput:e=>pass=e.target.value})),
    h('div',{className:'field'},h('label',{},'Teléfono (opcional)'),h('input',{className:'input',placeholder:'+54 9...',onInput:e=>phone=e.target.value})),
    errEl,
    h('div',{className:'modal-footer'},
      h('button',{className:'btn',onClick:closeModal},'Cancelar'),
      h('button',{className:'btn btn-green',id:'btn-add-seller',onClick:async()=>{
        if(!name||!email||!pass){errEl.textContent='Completá nombre, email y contraseña.';errEl.style.display='block';return;}
        if(pass.length<6){errEl.textContent='Contraseña mínimo 6 caracteres.';errEl.style.display='block';return;}
        setBtnLoading('btn-add-seller','Guardando...');
        const {data:sd,error:se}=await sb.from('sellers').insert({name,email,phone:phone||null,paid_bonus_groups:0}).select().single();
        if(se){showErr(errEl,'Error: '+se.message,'btn-add-seller','Guardar');return;}
        const {error:ue}=await sb.from('users').insert({name,email:email.toLowerCase(),password:pass,role:'seller',seller_id:sd.id});
        if(ue){showErr(errEl,'Error al crear usuario: '+ue.message,'btn-add-seller','Guardar');return;}
        cache.sellers.push(sd);
        const {data:ud}=await sb.from('users').select('*').eq('seller_id',sd.id).single();
        if(ud) cache.users.push(ud);
        await dbAddHistory('seller','Nuevo vendedor: '+name);
        closeModal();
      }},'Guardar')
    )
  );
}

function modalEditSeller(s){
  const user=cache.users.find(u=>u.seller_id===s.id);
  let name=s.name,email=s.email,phone=s.phone||'',pass='';
  return h('div',{className:'modal'},
    h('h2',{},'Editar vendedor'),
    h('div',{className:'field'},h('label',{},'Nombre'),h('input',{className:'input',value:name,onInput:e=>name=e.target.value})),
    h('div',{className:'field'},h('label',{},'Email'),h('input',{className:'input',type:'email',value:email,onInput:e=>email=e.target.value})),
    h('div',{className:'field'},h('label',{},'Nueva contraseña (vacío = no cambiar)'),h('input',{className:'input',placeholder:'••••••',onInput:e=>pass=e.target.value})),
    h('div',{className:'field'},h('label',{},'Teléfono'),h('input',{className:'input',value:phone,onInput:e=>phone=e.target.value})),
    h('div',{className:'modal-footer'},
      h('button',{className:'btn',onClick:closeModal},'Cancelar'),
      h('button',{className:'btn btn-green',id:'btn-edit-seller',onClick:async()=>{
        setBtnLoading('btn-edit-seller','Guardando...');
        await sb.from('sellers').update({name,email,phone:phone||null}).eq('id',s.id);
        const si=cache.sellers.findIndex(x=>x.id===s.id); if(si>=0){cache.sellers[si].name=name;cache.sellers[si].email=email;cache.sellers[si].phone=phone;}
        if(user){const upd={name,email:email.toLowerCase()};if(pass)upd.password=pass;await sb.from('users').update(upd).eq('id',user.id);const ui=cache.users.findIndex(x=>x.id===user.id);if(ui>=0){cache.users[ui].name=name;cache.users[ui].email=email;if(pass)cache.users[ui].password=pass;}}
        await dbAddHistory('seller','Vendedor editado: '+name);
        closeModal();
      }},'Guardar')
    )
  );
}

function modalAddClient(){
  let name='',sellerId='',startDate=today(),notes='';
  const errEl=h('div',{className:'err',style:'display:none'});
  return h('div',{className:'modal'},
    h('h2',{},'Nuevo cliente'),
    h('div',{className:'field'},h('label',{},'Nombre / empresa'),h('input',{className:'input',placeholder:'Empresa S.A.',onInput:e=>name=e.target.value})),
    h('div',{className:'field'},h('label',{},'Vendedor'),h('select',{className:'input',onChange:e=>sellerId=e.target.value},
      h('option',{value:''},'Seleccioná un vendedor'),
      ...cache.sellers.map(s=>h('option',{value:s.id},s.name))
    )),
    h('div',{className:'field'},h('label',{},'Fecha de alta'),h('input',{className:'input',type:'date',value:startDate,onInput:e=>startDate=e.target.value})),
    h('div',{className:'field'},h('label',{},'Notas'),h('input',{className:'input',placeholder:'...',onInput:e=>notes=e.target.value})),
    errEl,
    h('div',{className:'modal-footer'},
      h('button',{className:'btn',onClick:closeModal},'Cancelar'),
      h('button',{className:'btn btn-green',id:'btn-add-client',onClick:async()=>{
        if(!name||!sellerId){errEl.textContent='Completá nombre y vendedor.';errEl.style.display='block';return;}
        setBtnLoading('btn-add-client','Guardando...');
        const {data,error}=await sb.from('clients').insert({name,seller_id:sellerId,start_date:startDate,notes:notes||null,status:'active',closing_paid:false}).select().single();
        if(error){showErr(errEl,'Error: '+error.message,'btn-add-client','Guardar');return;}
        cache.clients.push(data);
        const sn=(cache.sellers.find(s=>s.id===sellerId)||{}).name||'?';
        await dbAddHistory('client','Nuevo cliente: '+name+' → '+sn,sellerId);
        closeModal();
      }},'Guardar')
    )
  );
}

function modalEditClient(c){
  let name=c.name,sellerId=c.seller_id,notes=c.notes||'';
  return h('div',{className:'modal'},
    h('h2',{},'Editar cliente'),
    h('div',{className:'field'},h('label',{},'Nombre'),h('input',{className:'input',value:name,onInput:e=>name=e.target.value})),
    h('div',{className:'field'},h('label',{},'Vendedor'),h('select',{className:'input',onChange:e=>sellerId=e.target.value},
      ...cache.sellers.map(s=>h('option',{value:s.id,...(s.id===c.seller_id?{selected:'selected'}:{})},s.name))
    )),
    h('div',{className:'field'},h('label',{},'Notas'),h('input',{className:'input',value:notes,onInput:e=>notes=e.target.value})),
    h('div',{className:'modal-footer'},
      h('button',{className:'btn',onClick:closeModal},'Cancelar'),
      h('button',{className:'btn btn-green',id:'btn-edit-client',onClick:async()=>{
        setBtnLoading('btn-edit-client','Guardando...');
        await sb.from('clients').update({name,seller_id:sellerId,notes:notes||null}).eq('id',c.id);
        const i=cache.clients.findIndex(x=>x.id===c.id); if(i>=0){cache.clients[i].name=name;cache.clients[i].seller_id=sellerId;cache.clients[i].notes=notes;}
        await dbAddHistory('client','Cliente editado: '+name);
        closeModal();
      }},'Guardar')
    )
  );
}

function modalAddFee(data){
  let clientId='',amount='',month=data.month||today().slice(0,7);
  const errEl=h('div',{className:'err',style:'display:none'});
  const active=cache.clients.filter(c=>c.status==='active');
  return h('div',{className:'modal'},
    h('h2',{},'Cargar fee mensual (ARS)'),
    h('div',{className:'field'},h('label',{},'Mes'),h('input',{className:'input',type:'month',value:month,onInput:e=>month=e.target.value})),
    h('div',{className:'field'},h('label',{},'Cliente'),h('select',{className:'input',onChange:e=>clientId=e.target.value},
      h('option',{value:''},'Seleccioná cliente'),
      ...active.map(c=>{const s=cache.sellers.find(sl=>sl.id===c.seller_id);return h('option',{value:c.id},c.name+(s?' ('+s.name+')':''));})
    )),
    h('div',{className:'field'},h('label',{},'Monto en ARS'),h('input',{className:'input',type:'number',placeholder:'0',onInput:e=>amount=e.target.value})),
    errEl,
    h('div',{className:'modal-footer'},
      h('button',{className:'btn',onClick:closeModal},'Cancelar'),
      h('button',{className:'btn btn-green',id:'btn-add-fee',onClick:async()=>{
        if(!clientId||!amount||isNaN(Number(amount))){errEl.textContent='Completá todos los campos.';errEl.style.display='block';return;}
        if(cache.fees.find(f=>f.client_id===clientId&&f.month===month)){errEl.textContent='Ya hay un fee para ese cliente en ese mes.';errEl.style.display='block';return;}
        setBtnLoading('btn-add-fee','Guardando...');
        const {data,error}=await sb.from('fees').insert({client_id:clientId,month,amount:Number(amount),paid:false}).select().single();
        if(error){showErr(errEl,'Error: '+error.message,'btn-add-fee','Guardar');return;}
        cache.fees.push(data);
        const cl=cache.clients.find(x=>x.id===clientId);
        await dbAddHistory('fee','Fee cargado: '+(cl?cl.name:'?')+' — '+month+' — '+fmtARS(amount),cl?cl.seller_id:null);
        closeModal();
      }},'Guardar')
    )
  );
}

// ── ACTIONS ───────────────────────────────────────────────
async function toggleClientStatus(c){
  const ns=c.status==='active'?'inactive':'active';
  await sb.from('clients').update({status:ns}).eq('id',c.id);
  const i=cache.clients.findIndex(x=>x.id===c.id); if(i>=0) cache.clients[i].status=ns;
  await dbAddHistory('status','Cliente '+c.name+' → '+(ns==='active'?'activo':'inactivo'),c.seller_id);
  render();
}
async function deleteFee(fid){
  if(!confirm('¿Eliminar este fee?')) return;
  await sb.from('fees').delete().eq('id',fid);
  await sb.from('payments').delete().eq('ref','fee_'+fid);
  cache.fees=cache.fees.filter(f=>f.id!==fid);
  cache.payments=cache.payments.filter(p=>p.ref!=='fee_'+fid);
  render();
}
async function deleteSeller(id){
  if(!confirm('¿Eliminar este vendedor y toda su data?')) return;
  const s=cache.sellers.find(x=>x.id===id);
  await sb.from('sellers').delete().eq('id',id);
  cache.sellers=cache.sellers.filter(x=>x.id!==id);
  cache.users=cache.users.filter(x=>x.seller_id!==id);
  await dbAddHistory('seller','Vendedor eliminado: '+(s?s.name:'?'));
  render();
}

// ── UI HELPERS ────────────────────────────────────────────
function metricCard(label,value,color){ return h('div',{className:'metric'},h('div',{className:'metric-label'},label),h('div',{className:'metric-value'+(color?' '+color:'')},String(value))); }
function th(t){ return h('th',{},t); }
function td(content){ const cell=h('td',{}); if(content==null) return cell; if(typeof content==='string'||typeof content==='number') cell.appendChild(document.createTextNode(String(content))); else cell.appendChild(content); return cell; }
function setBtnLoading(id,msg){ const b=document.getElementById(id); if(b){b.disabled=true;b.textContent=msg;} }
function showErr(errEl,msg,btnId,btnText){ errEl.textContent=msg; errEl.style.display='block'; const b=document.getElementById(btnId); if(b){b.disabled=false;b.textContent=btnText;} }

render();
</script>
</body>
</html>
