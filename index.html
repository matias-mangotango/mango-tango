<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mango Tango — Comisiones</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; min-height: 100vh; }

/* AUTH */
.auth-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:2rem; }
.auth-card { background:#fff; border:1px solid #e5e5e5; border-radius:14px; padding:2.5rem 2rem; width:100%; max-width:380px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
.brand { text-align:center; margin-bottom:2rem; }
.brand-icon { width:60px; height:60px; background:#1D9E75; border-radius:16px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; font-size:30px; }
.brand h1 { font-size:22px; font-weight:600; }
.brand p { font-size:13px; color:#666; margin-top:4px; }
.field { margin-bottom:1rem; }
.field label { display:block; font-size:13px; color:#555; margin-bottom:6px; font-weight:500; }
.field input, .field textarea, .field select { width:100%; padding:9px 12px; border:1px solid #ddd; border-radius:8px; background:#fafafa; color:#1a1a1a; font-size:14px; outline:none; font-family:inherit; transition:border-color 0.15s; }
.field input:focus, .field textarea:focus, .field select:focus { border-color:#1D9E75; background:#fff; }
.btn-primary { width:100%; padding:11px; background:#1D9E75; color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
.btn-primary:hover { background:#0F6E56; }
.btn-primary:disabled { background:#9fd5c4; cursor:not-allowed; }
.err { color:#e24b4a; font-size:13px; margin-top:8px; }

/* LAYOUT */
.layout { display:flex; min-height:100vh; }
.sidebar { width:224px; background:#fff; border-right:1px solid #e5e5e5; display:flex; flex-direction:column; padding:1.5rem 0; flex-shrink:0; }
.sidebar-brand { padding:0 1.25rem 1.5rem; border-bottom:1px solid #f0f0f0; margin-bottom:1rem; }
.logo { display:flex; align-items:center; gap:10px; }
.logo-icon { width:34px; height:34px; background:#1D9E75; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.logo-name { font-size:14px; font-weight:600; }
.nav-item { display:flex; align-items:center; gap:10px; padding:9px 1.25rem; font-size:13px; color:#666; cursor:pointer; border-left:2px solid transparent; transition:all 0.12s; }
.nav-item:hover { background:#f5f5f3; color:#1a1a1a; }
.nav-item.active { color:#1D9E75; background:#f0faf6; border-left-color:#1D9E75; font-weight:600; }
.sidebar-footer { margin-top:auto; padding:1rem 1.25rem; border-top:1px solid #f0f0f0; }
.avatar { width:30px; height:30px; border-radius:50%; background:#1D9E75; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff; flex-shrink:0; }
.user-chip { display:flex; align-items:center; gap:8px; }
.user-info { flex:1; min-width:0; }
.user-name { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.user-role { font-size:11px; color:#888; }
.logout-btn { background:none; border:none; cursor:pointer; color:#888; font-size:11px; text-decoration:underline; padding:0; margin-top:4px; }
.logout-btn:hover { color:#e24b4a; }
.main { flex:1; overflow-y:auto; padding:2rem; }
.page-header { margin-bottom:1.5rem; }
.page-title { font-size:20px; font-weight:600; }
.page-sub { font-size:13px; color:#666; margin-top:4px; }

/* CARDS */
.card { background:#fff; border:1px solid #e5e5e5; border-radius:12px; padding:1.25rem; margin-bottom:1rem; }
.metric-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:1.5rem; }
.metric { background:#f5f5f3; border-radius:8px; padding:1rem; }
.metric-label { font-size:12px; color:#666; margin-bottom:6px; }
.metric-value { font-size:19px; font-weight:600; }
.metric-value.green { color:#1D9E75; }
.metric-value.amber { color:#BA7517; }

/* TABLE */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead th { text-align:left; padding:8px 10px; color:#666; font-weight:600; border-bottom:1px solid #f0f0f0; white-space:nowrap; }
tbody td { padding:10px; border-bottom:1px solid #f5f5f3; vertical-align:middle; }
tbody tr:last-child td { border-bottom:none; }
tbody tr:hover { background:#fafafa; }

/* BADGES */
.badge { display:inline-flex; align-items:center; padding:3px 8px; border-radius:100px; font-size:11px; font-weight:600; white-space:nowrap; }
.badge-green { background:#EAF3DE; color:#3B6D11; }
.badge-amber { background:#FAEEDA; color:#854F0B; }
.badge-red { background:#FCEBEB; color:#A32D2D; }
.badge-gray { background:#f0f0f0; color:#666; }
.badge-blue { background:#E6F1FB; color:#185FA5; }
.badge-teal { background:#E1F5EE; color:#085041; }

/* BUTTONS */
.btn { padding:7px 14px; border-radius:8px; font-size:13px; cursor:pointer; border:1px solid #ddd; background:#fff; color:#1a1a1a; font-family:inherit; }
.btn:hover { background:#f5f5f3; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.btn-green { background:#1D9E75; color:#fff; border-color:#1D9E75; }
.btn-green:hover { background:#0F6E56; }
.btn-sm { padding:4px 10px; font-size:12px; }
.btn-danger { background:none; border-color:#e24b4a; color:#e24b4a; }
.btn-danger:hover { background:#FCEBEB; }
.btn-link { background:none; border:none; color:#1D9E75; font-size:12px; cursor:pointer; padding:0; text-decoration:underline; font-family:inherit; }

/* MODAL */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center; z-index:100; padding:1rem; }
.modal { background:#fff; border-radius:14px; padding:1.75rem; width:100%; max-width:500px; max-height:90vh; overflow-y:auto; box-shadow:0 8px 40px rgba(0,0,0,0.15); }
.modal h2 { font-size:16px; font-weight:600; margin-bottom:1.25rem; }
.modal-footer { display:flex; justify-content:flex-end; gap:8px; margin-top:1.25rem; }

/* UTILS */
.flex { display:flex; } .items-center { align-items:center; } .justify-between { justify-content:space-between; }
.gap-2 { gap:8px; } .gap-3 { gap:12px; }
.mb-1 { margin-bottom:.5rem; } .mb-2 { margin-bottom:1rem; } .mb-3 { margin-bottom:1.5rem; }
.text-sm { font-size:13px; } .text-xs { font-size:12px; } .text-muted { color:#666; }
.section-title { font-size:14px; font-weight:600; margin-bottom:1rem; }
.input { width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:8px; background:#fafafa; color:#1a1a1a; font-size:13px; outline:none; font-family:inherit; }
.input:focus { border-color:#1D9E75; }
.empty-state { text-align:center; padding:3rem 1rem; color:#888; font-size:13px; }
.bonus-notice { background:#FAEEDA; border:1px solid #FAC775; border-radius:8px; padding:10px 14px; font-size:13px; color:#854F0B; margin-bottom:1rem; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.divider { border:none; border-top:1px solid #f0f0f0; margin:1rem 0; }
.receipt-box { background:#f5f5f3; border-radius:8px; padding:10px 12px; font-size:13px; color:#555; margin-bottom:8px; }
.receipt-box strong { color:#1a1a1a; }
.file-drop { border:1.5px dashed #ccc; border-radius:8px; padding:18px; text-align:center; cursor:pointer; font-size:13px; color:#888; transition:border-color 0.15s; }
.file-drop:hover { border-color:#1D9E75; color:#1D9E75; }
.file-preview { display:flex; align-items:center; gap:8px; background:#f5f5f3; border-radius:8px; padding:8px 12px; font-size:12px; margin-top:6px; }
.tipo-toggle { display:flex; gap:6px; margin-bottom:1rem; }
.tipo-btn { flex:1; padding:8px; border:1px solid #ddd; border-radius:8px; background:#fafafa; color:#666; font-size:13px; cursor:pointer; text-align:center; font-family:inherit; }
.tipo-btn.selected { background:#1D9E75; color:#fff; border-color:#1D9E75; font-weight:600; }
.pill-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
.inactive-label { font-size:11px; color:#888; font-weight:600; letter-spacing:.04em; text-transform:uppercase; margin-bottom:8px; padding-top:4px; }
.loading-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; flex-direction:column; gap:12px; color:#666; font-size:14px; }
.spinner { width:32px; height:32px; border:3px solid #e5e5e5; border-top-color:#1D9E75; border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

@media (max-width:700px) {
  .sidebar { width:52px; }
  .nav-item .label { display:none; }
  .logo-name, .user-info, .logout-btn { display:none; }
  .main { padding:1rem; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ── SUPABASE INIT ──────────────────────────────────────────
const SUPABASE_URL = 'https://tiedxprzbdtrzzycgyff.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpZWR4cHJ6YmR0cnp6eWNneWZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MTk5MzksImV4cCI6MjA5MzE5NTkzOX0.4pda6N9jHPPCpwX2Vvw6mmUS3pxpQcrp4mTx5Eeqf_w';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── GLOBALS ───────────────────────────────────────────────
let currentUser = null;
let currentView = 'dashboard';
let modal = null;
let cache = { sellers:[], clients:[], fees:[], payments:[], history:[] };

// ── HELPERS ───────────────────────────────────────────────
function fmtARS(n){ return '$' + Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function fmtUSD(n){ return 'U$S ' + Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('es-AR') : '—'; }
function today(){ return new Date().toISOString().slice(0,10); }
function uid(){ return crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2); }

function getSellerClients(sid){ return cache.clients.filter(c=>c.seller_id===sid); }
function getMonthFees(sid,month){
  const ids = getSellerClients(sid).map(c=>c.id);
  return cache.fees.filter(f=>f.month===month && ids.includes(f.client_id));
}
function calcUnpaidBonuses(sid){
  const seller = cache.sellers.find(s=>s.id===sid)||{};
  const n = getSellerClients(sid).length;
  return Math.max(0, Math.floor(n/3) - (seller.paid_bonus_groups||0)) * 1000;
}
function getSellerStats(sid){
  const clients = getSellerClients(sid);
  const active = clients.filter(c=>c.status==='active');
  const allFees = cache.fees.filter(f=>clients.map(c=>c.id).includes(f.client_id));
  const recurringPaid = allFees.filter(f=>f.paid).reduce((s,f)=>s+f.amount*0.05,0);
  const pendingRecurringARS = allFees.filter(f=>!f.paid).reduce((s,f)=>s+f.amount*0.05,0);
  const closingUnpaidCount = clients.filter(c=>!c.closing_paid).length;
  return { activeClients:active.length, totalClients:clients.length, recurringPaid, pendingRecurringARS, closingUnpaidCount };
}
function getPayment(ref){ return cache.payments.find(p=>p.ref===ref); }

// ── DB HELPERS ────────────────────────────────────────────
async function dbLoadAll(){
  const [s,u,c,f,p,h] = await Promise.all([
    sb.from('sellers').select('*').order('created_at'),
    sb.from('users').select('*'),
    sb.from('clients').select('*').order('created_at'),
    sb.from('fees').select('*').order('month'),
    sb.from('payments').select('*').order('created_at'),
    sb.from('history').select('*').order('created_at',{ascending:false}).limit(300),
  ]);
  cache.sellers = s.data||[];
  cache.users = u.data||[];
  cache.clients = c.data||[];
  cache.fees = f.data||[];
  cache.payments = p.data||[];
  cache.history = h.data||[];
}

async function dbAddHistory(type, desc, sellerId=null, paymentRef=null){
  const {data} = await sb.from('history').insert({type, description:desc, seller_id:sellerId||null, payment_ref:paymentRef||null}).select().single();
  if(data) cache.history.unshift(data);
  return data;
}

// ── RENDER ENGINE ─────────────────────────────────────────
function h(tag,attrs,...children){
  const el = document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==='className') el.className=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='checked') el.checked=v;
    else el.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(c=>{
    if(c==null||c===false) return;
    el.appendChild(typeof c==='string'||typeof c==='number' ? document.createTextNode(String(c)) : c);
  });
  return el;
}

function showLoading(msg='Cargando...'){
  document.getElementById('app').innerHTML='';
  document.getElementById('app').appendChild(
    h('div',{className:'loading-screen'}, h('div',{className:'spinner'}), h('span',{},msg))
  );
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML='';
  if(!currentUser){ app.appendChild(renderLogin()); return; }
  app.appendChild(renderApp());
}

// ── LOGIN ─────────────────────────────────────────────────
function renderLogin(){
  let errEl;
  const wrap = h('div',{className:'auth-wrap'},
    h('div',{className:'auth-card'},
      h('div',{className:'brand'},
        h('div',{className:'brand-icon'},'🥭'),
        h('h1',{},'Mango Tango'),
        h('p',{},'Sistema de Comisiones')
      ),
      h('div',{className:'field'},h('label',{},'Email'),h('input',{type:'email',id:'le',placeholder:'tu@email.com'})),
      h('div',{className:'field'},h('label',{},'Contraseña'),h('input',{type:'password',id:'lp',placeholder:'••••••••',
        onKeydown:e=>{ if(e.key==='Enter') doLogin(); }
      })),
      errEl = h('div',{className:'err',style:'display:none'}),
      h('button',{className:'btn-primary',style:'margin-top:8px',id:'loginbtn',onClick:doLogin},'Ingresar')
    )
  );
  async function doLogin(){
    const email = document.getElementById('le').value.trim();
    const pass = document.getElementById('lp').value;
    document.getElementById('loginbtn').disabled=true;
    document.getElementById('loginbtn').textContent='Ingresando...';
    const {data,error} = await sb.from('users').select('*').eq('email',email.toLowerCase()).eq('password',pass).single();
    if(error||!data){ errEl.textContent='Email o contraseña incorrectos'; errEl.style.display='block'; document.getElementById('loginbtn').disabled=false; document.getElementById('loginbtn').textContent='Ingresar'; return; }
    currentUser = data;
    showLoading('Cargando datos...');
    await dbLoadAll();
    currentView = 'dashboard';
    render();
  }
  return wrap;
}

// ── SHELL ─────────────────────────────────────────────────
function renderApp(){
  const isAdmin = currentUser.role==='admin';
  const navItems = isAdmin
    ?[{id:'dashboard',icon:'◻',label:'Resumen'},{id:'sellers',icon:'👤',label:'Vendedores'},{id:'clients',icon:'🏢',label:'Clientes'},{id:'fees',icon:'💵',label:'Facturación'},{id:'commissions',icon:'📊',label:'Comisiones'},{id:'history',icon:'📋',label:'Historial'}]
    :[{id:'dashboard',icon:'◻',label:'Mi panel'},{id:'my-clients',icon:'🏢',label:'Mis clientes'},{id:'my-commissions',icon:'💵',label:'Mis comisiones'},{id:'history',icon:'📋',label:'Historial'}];

  const sidebar = h('div',{className:'sidebar'},
    h('div',{className:'sidebar-brand'},h('div',{className:'logo'},h('div',{className:'logo-icon'},'🥭'),h('span',{className:'logo-name'},'Mango Tango'))),
    ...navItems.map(n=>h('div',{className:'nav-item'+(currentView===n.id?' active':''),onClick:()=>{currentView=n.id;render();}},
      h('span',{style:'font-size:14px;width:16px;text-align:center;flex-shrink:0'},n.icon),
      h('span',{className:'label'},n.label)
    )),
    h('div',{className:'sidebar-footer'},
      h('div',{className:'user-chip'},
        h('div',{className:'avatar'},currentUser.name.slice(0,2).toUpperCase()),
        h('div',{className:'user-info'},h('div',{className:'user-name'},currentUser.name),h('div',{className:'user-role'},isAdmin?'Administrador':'Vendedor'))
      ),
      h('button',{className:'logout-btn',onClick:()=>{currentUser=null;cache={sellers:[],clients:[],fees:[],payments:[],history:[]};render();}},'Cerrar sesión')
    )
  );
  const main = h('div',{className:'main'},renderView());
  const layout = h('div',{className:'layout'},sidebar,main);
  const app = h('div',{className:'app'},layout);
  if(modal) app.appendChild(renderModal());
  return app;
}

function renderView(){
  const isAdmin = currentUser.role==='admin';
  if(currentView==='dashboard') return isAdmin ? renderAdminDashboard() : renderSellerDashboard();
  if(currentView==='sellers') return renderSellers();
  if(currentView==='clients') return renderClients();
  if(currentView==='fees') return renderFees();
  if(currentView==='commissions') return renderCommissions();
  if(currentView==='history') return renderHistory();
  if(currentView==='my-clients') return renderMyClients();
  if(currentView==='my-commissions') return renderMyCommissions();
  return h('div',{},'Vista no encontrada');
}

// ── ADMIN DASHBOARD ───────────────────────────────────────
function renderAdminDashboard(){
  const curMonth = today().slice(0,7);
  const mrr = cache.fees.filter(f=>f.month===curMonth).reduce((s,f)=>s+f.amount,0);
  let pendingARS = 0;
  cache.sellers.forEach(s=>{ pendingARS += getSellerStats(s.id).pendingRecurringARS; });
  return h('div',{},
    h('div',{className:'page-header'},h('h1',{className:'page-title'},'Panel General'),h('p',{className:'page-sub'},'Resumen de Mango Tango')),
    h('div',{className:'metric-grid'},
      metricCard('Vendedores',cache.sellers.length,''),
      metricCard('Clientes activos',cache.clients.filter(c=>c.status==='active').length,'green'),
      metricCard('Facturación del mes',fmtARS(mrr),'green'),
      metricCard('Comisiones ARS pendientes',fmtARS(pendingARS),'amber'),
    ),
    h('div',{className:'card'},
      h('div',{className:'flex items-center justify-between mb-2'},
        h('p',{className:'section-title',style:'margin:0'},'Vendedores'),
        h('button',{className:'btn btn-green btn-sm',onClick:()=>openModal('add-seller')},'+ Nuevo vendedor')
      ),
      cache.sellers.length===0 ? h('div',{className:'empty-state'},'No hay vendedores aún.')
      : h('div',{className:'table-wrap'},h('table',{},
        h('thead',{},h('tr',{},th('Vendedor'),th('Clientes'),th('Cierres USD pendientes'),th('Comisiones ARS pendientes'),th(''))),
        h('tbody',{},...cache.sellers.map(s=>{
          const st=getSellerStats(s.id);
          return h('tr',{},
            td(h('div',{className:'flex items-center gap-2'},h('div',{className:'avatar',style:'width:26px;height:26px;font-size:10px'},s.name.slice(0,2).toUpperCase()),h('span',{},s.name))),
            td(st.activeClients+' activos / '+st.totalClients+' total'),
            td(h('span',{style:'color:#BA7517;font-weight:600'},st.closingUnpaidCount+' cliente'+(st.closingUnpaidCount===1?'':'s'))),
            td(h('span',{style:'color:#BA7517;font-weight:600'},fmtARS(st.pendingRecurringARS))),
            td(h('button',{className:'btn btn-sm',onClick:()=>{currentView='commissions';render();}},'Ver detalle'))
          );
        }))
      ))
    )
  );
}

// ── SELLER DASHBOARD ──────────────────────────────────────
function renderSellerDashboard(){
  const sid = currentUser.seller_id;
  if(!sid) return h('div',{className:'empty-state'},'Tu cuenta no está vinculada a un vendedor. Contactá al administrador.');
  const stats = getSellerStats(sid);
  const clients = getSellerClients(sid);
  const curMonth = today().slice(0,7);
  const monthFees = getMonthFees(sid,curMonth);
  const monthComm = monthFees.reduce((s,f)=>s+f.amount*0.05,0);
  const nextBonus = 3-(clients.length%3);
  return h('div',{},
    h('div',{className:'page-header'},h('h1',{className:'page-title'},'¡Hola, '+currentUser.name+'!'),h('p',{className:'page-sub'},'Tu panel de comisiones')),
    nextBonus<3&&nextBonus>0&&h('div',{className:'bonus-notice'},'🎯 ',h('span',{},'Te '+(nextBonus===1?'falta 1 cliente':'faltan '+nextBonus+' clientes')+' para tu próximo bono de U$S 1.000')),
    h('div',{className:'metric-grid'},
      metricCard('Clientes activos',stats.activeClients,'green'),
      metricCard('Total clientes',stats.totalClients,''),
      metricCard('Comisión ARS este mes',fmtARS(monthComm),'green'),
      metricCard('Comisiones ARS pendientes',fmtARS(stats.pendingRecurringARS),'amber'),
    ),
    h('div',{className:'card'},
      h('p',{className:'section-title'},'Clientes activos — '+curMonth),
      clients.filter(c=>c.status==='active').length===0 ? h('div',{className:'empty-state'},'No tenés clientes activos.')
      : h('div',{className:'table-wrap'},h('table',{},
        h('thead',{},h('tr',{},th('Cliente'),th('Fee este mes'),th('Comisión 5%'),th('Estado'))),
        h('tbody',{},...clients.filter(c=>c.status==='active').map(c=>{
          const f=cache.fees.find(f=>f.client_id===c.id&&f.month===curMonth);
          return h('tr',{},td(c.name),
            td(f?fmtARS(f.amount):h('span',{className:'text-muted'},'Sin cargar')),
            td(f?fmtARS(f.amount*0.05):'—'),
            td(f&&f.paid?h('span',{className:'badge badge-green'},'Pagado'):f?h('span',{className:'badge badge-amber'},'Pendiente'):h('span',{className:'badge badge-gray'},'Sin fee'))
          );
        }))
      ))

function openModal(type,data){ modal={type,data}; render(); }
function closeModal(){ modal=null; render(); }
function renderModal(){
  const overlay=h('div',{className:'modal-overlay',onClick:e=>{if(e.target===overlay)closeModal();}});
  let content;
  if(modal.type==='add-seller') content=modalAddSeller();
  else if(modal.type==='edit-seller') content=modalEditSeller(modal.data);
  else if(modal.type==='add-client') content=modalAddClient();
  else if(modal.type==='edit-client') content=modalEditClient(modal.data);
  else if(modal.type==='add-fee') content=modalAddFee(modal.data);
  else if(modal.type==='pay-fee') content=modalPayFee(modal.data);
  else if(modal.type==='pay-closing') content=modalPayClosing(modal.data);
  else if(modal.type==='pay-month') content=modalPayMonth(modal.data);
  else if(modal.type==='pay-bonus') content=modalPayBonus(modal.data);
  else if(modal.type==='view-payment') content=modalViewPayment(modal.data);
  overlay.appendChild(content);
  return overlay;
}

// ── PAYMENT SECTION ───────────────────────────────────────
function buildPaymentSection(pref){
  const fileInput=h('input',{type:'file',style:'display:none',accept:'image/*,.pdf',onChange:e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{pref.fileData=ev.target.result; pref.fileName=file.name; updatePreview();};
    reader.readAsDataURL(file);
  }});
  const preview=h('div',{style:'margin-top:6px'});
  function updatePreview(){
    preview.innerHTML='';
    if(pref.fileData) preview.appendChild(h('div',{className:'file-preview'},
      h('span',{},pref.fileData.startsWith('data:image')?'🖼':'📄'),
      h('span',{style:'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},pref.fileName),
      h('button',{className:'btn-link',style:'color:#e24b4a',onClick:()=>{pref.fileData=null;pref.fileName=null;updatePreview();}},'Quitar')
    ));
  }
  const notesInput=h('textarea',{className:'input',style:'resize:vertical;min-height:60px;margin-top:8px',placeholder:'Aclaraciones (opcional)...',onInput:e=>{pref.notes=e.target.value;}});
  return h('div',{},
    h('hr',{className:'divider'}),
    h('p',{className:'text-sm text-muted',style:'margin-bottom:6px'},'Comprobante de pago'),
    fileInput,
    h('div',{className:'file-drop',onClick:()=>fileInput.click()},'📎 Adjuntar imagen o PDF'),
    preview, notesInput
  );
}

function buildUSDSection(pref){
  pref.currency='usd';
  const arsFields=h('div',{style:'display:none'},

  );
  const usdFields=h('div',{},
    h('div',{className:'field',style:'margin-top:8px'},h('label',{},'Tipo de cambio (ARS por U$S)'),h('input',{className:'input',type:'number',placeholder:'Ej: 1200',onInput:e=>pref.tc=e.target.value})),
    h('div',{className:'field'},h('label',{},'Monto en dólares (U$S)'),h('input',{className:'input',type:'number',placeholder:'Ej: 150',onInput:e=>pref.usdAmt=e.target.value}))
  );
  function setCurrency(v){
    pref.currency=v;
    document.getElementById('tbtn-ars').className='tipo-btn'+(v==='ars'?' selected':'');
    document.getElementById('tbtn-usd').className='tipo-btn'+(v==='usd'?' selected':'');
    arsFields.style.display=v==='ars'?'':'none';
    usdFields.style.display=v==='usd'?'':'none';
  }
  return h('div',{},
    h('p',{className:'text-sm text-muted',style:'margin-bottom:8px'},'¿En qué moneda pagás?'),
    h('div',{className:'tipo-toggle'},
      h('div',{className:'tipo-btn',id:'tbtn-ars',onClick:()=>setCurrency('ars')},'Pesos ARS'),
      h('div',{className:'tipo-btn selected',id:'tbtn-usd',onClick:()=>setCurrency('usd')},'Dólares U$S')
    ),
    arsFields, usdFields
  );
}

function resolveUSD(pref){
  if(pref.currency==='usd'){
    if(!pref.tc||!pref.usdAmt) return null;
    const usd=parseFloat(pref.usdAmt), tc=parseFloat(pref.tc);
    return {currency:'usd', usd_amount:usd, tc_value:tc, ars_amount:usd*tc};
  } else {
    if(!pref.arsAmt) return null;
    return {currency:'ars', usd_amount:null, tc_value:null, ars_amount:parseFloat(pref.arsAmt)};
  }
}

  const pref={fileData:null,fileName:null,notes:'',currency:'usd',tc:'',usdAmt:'',arsAmt:''};
  const errEl=h('div',{className:'err',style:'display:none'});
  return h('div',{className:'modal'},
    h('h2',{},'Pagar comisión de cierre (U$S)'),
    h('div',{className:'receipt-box'},h('strong',{},'Cliente: '),client.name,h('br',{}),h('span',{className:'text-xs text-muted'},'Comisión de cierre en dólares')),
    buildUSDSection(pref),
    buildPaymentSection(pref),
    errEl,
    h('div',{className:'modal-footer'},
      h('button',{className:'btn',onClick:closeModal},'Cancelar'),
      h('button',{className:'btn btn-green',id:'pay-closing-btn',onClick:async()=>{
        const amounts=resolveUSD(pref);
        if(!amounts){errEl.textContent='Completá los campos de pago.';errEl.style.display='block';return;}
        document.getElementById('pay-closing-btn').disabled=true;
        document.getElementById('pay-closing-btn').textContent='Guardando...';
        const ref='closing_'+client.id;
        const {data:payData}=await sb.from('payments').insert({ref,type:'closing',...amounts,file_data:pref.fileData,file_name:pref.fileName,notes:pref.notes}).select().single();
        await sb.from('clients').update({closing_paid:true}).eq('id',client.id);
        const ci=cache.clients.findIndex(c=>c.id===client.id); if(ci>=0) cache.clients[ci].closing_paid=true;
        if(payData){cache.payments.push(payData);}
        const desc='Cierre pagado: '+client.name+' — '+(amounts.currency==='usd'?fmtUSD(amounts.usd_amount)+' (TC $'+amounts.tc_value+' = '+fmtARS(amounts.ars_amount)+')':fmtARS(amounts.ars_amount)+' ARS');
        await dbAddHistory('payment',desc,client.seller_id,ref);
        closeModal();
      }},'Confirmar pago')
    )
  );
}

// ── PAY MONTH BULK (ARS) ──────────────────────────────────
function modalPayMonth({seller,month,comm}){
  const pref={fileData:null,fileName:null,notes:''};
  return h('div',{className:'modal'},
    h('h2',{},'Pagar comisión del mes (ARS)'),
    h('div',{className:'receipt-box'},
      h('strong',{},'Vendedor: '),seller.name,h('br',{}),
      h('strong',{},'Mes: '),month,h('br',{}),
      h('strong',{},'Comisión 5%: '),h('span',{style:'color:#1D9E75;font-weight:600'},fmtARS(comm))
    ),
    buildPaymentSection(pref),
    h('div',{className:'modal-footer'},
      h('button',{className:'btn',onClick:closeModal},'Cancelar'),
      h('button',{className:'btn btn-green',id:'pay-month-btn',onClick:async()=>{
        document.getElementById('pay-month-btn').disabled=true;
        document.getElementById('pay-month-btn').textContent='Guardando...';
        const ref='month_'+seller.id+'_'+month;
        const ids=getSellerClients(seller.id).map(c=>c.id);
        const unpaidFees=cache.fees.filter(f=>f.month===month&&ids.includes(f.client_id)&&!f.paid);
        await Promise.all(unpaidFees.map(f=>sb.from('fees').update({paid:true}).eq('id',f.id)));
        unpaidFees.forEach(f=>{const i=cache.fees.findIndex(x=>x.id===f.id);if(i>=0)cache.fees[i].paid=true;});
        const {data:payData}=await sb.from('payments').insert({ref,type:'month',currency:'ars',ars_amount:comm,file_data:pref.fileData,file_name:pref.fileName,notes:pref.notes}).select().single();
        if(payData) cache.payments.push(payData);
        const desc='Comisión mensual pagada a '+seller.name+' — '+month+' — '+fmtARS(comm);
        await dbAddHistory('payment',desc,seller.id,ref);
        closeModal();
      }},'Confirmar pago')
    )
  );
}

// ── CRUD MODALS ───────────────────────────────────────────
function modalAddSeller(){
  let name='',email='',pass='',phone='';
  const errEl=h('div',{className:'err',style:'display:none'});
  return h('div',{className:'modal'},
    h('h2',{},'Nuevo vendedor'),
    h('div',{className:'field'},h('label',{},'Nombre completo'),h('input',{className:'input',placeholder:'Juan García',onInput:e=>name=e.target.value})),
    h('div',{className:'field'},h('label',{},'Email (para login)'),h('input',{className:'input',type:'email',placeholder:'juan@email.com',onInput:e=>email=e.target.value})),
    h('div',{className:'field'},h('label',{},'Contraseña'),h('input',{className:'input',placeholder:'mínimo 6 caracteres',onInput:e=>pass=e.target.value})),
    h('div',{className:'field'},h('label',{},'Teléfono (opcional)'),h('input',{className:'input',placeholder:'+54 9...',onInput:e=>phone=e.target.value})),
    errEl,
    h('div',{className:'modal-footer'},
      h('button',{className:'btn',onClick:closeModal},'Cancelar'),
      h('button',{className:'btn btn-green',id:'add-seller-btn',onClick:async()=>{
        if(!name||!email||!pass){errEl.textContent='Completá nombre, email y contraseña.';errEl.style.display='block';return;}
        if(pass.length<6){errEl.textContent='Contraseña mínimo 6 caracteres.';errEl.style.display='block';return;}
        document.getElementById('add-seller-btn').disabled=true;
        document.getElementById('add-seller-btn').textContent='Guardando...';
        const {data:sellerData,error:se}=await sb.from('sellers').insert({name,email,phone:phone||null,paid_bonus_groups:0}).select().single();
        if(se){errEl.textContent='Error: '+se.message;errEl.style.display='block';document.getElementById('add-seller-btn').disabled=false;document.getElementById('add-seller-btn').textContent='Guardar';return;}
        const {error:ue}=await sb.from('users').insert({name,email:email.toLowerCase(),password:pass,role:'seller',seller_id:sellerData.id});
        if(ue){errEl.textContent='Error al crear usuario: '+ue.message;errEl.style.display='block';document.getElementById('add-seller-btn').disabled=false;document.getElementById('add-seller-btn').textContent='Guardar';return;}
        cache.sellers.push(sellerData);
        const {data:ud}=await sb.from('users').select('*').eq('seller_id',sellerData.id).single();
        if(ud) cache.users.push(ud);
        await dbAddHistory('seller','Nuevo vendedor: '+name);
        closeModal();
      }},'Guardar')
    )
  );
}

function modalEditSeller(s){
  const user=cache.users.find(u=>u.seller_id===s.id);
  let name=s.name, email=s.email, phone=s.phone||'', pass='';
  const errEl=h('div',{className:'err',style:'display:none'});
  return h('div',{className:'modal'},
    h('h2',{},'Editar vendedor'),
    h('div',{className:'field'},h('label',{},'Nombre'),h('input',{className:'input',value:name,onInput:e=>name=e.target.value})),
    h('div',{className:'field'},h('label',{},'Email'),h('input',{className:'input',type:'email',value:email,onInput:e=>email=e.target.value})),
    h('div',{className:'field'},h('label',{},'Nueva contraseña (dejar vacío para no cambiar)'),h('input',{className:'input',placeholder:'••••••',onInput:e=>pass=e.target.value})),
    h('div',{className:'field'},h('label',{},'Teléfono'),h('input',{className:'input',value:phone,onInput:e=>phone=e.target.value})),
    errEl,
    h('div',{className:'modal-footer'},
      h('button',{className:'btn',onClick:closeModal},'Cancelar'),
      h('button',{className:'btn btn-green',id:'edit-seller-btn',onClick:async()=>{
        document.getElementById('edit-seller-btn').disabled=true;
        await sb.from('sellers').update({name,email,phone:phone||null}).eq('id',s.id);
        const si=cache.sellers.findIndex(x=>x.id===s.id); if(si>=0){cache.sellers[si].name=name;cache.sellers[si].email=email;cache.sellers[si].phone=phone;}
        if(user){
          const upd={name,email:email.toLowerCase()};
          if(pass) upd.password=pass;
          await sb.from('users').update(upd).eq('id',user.id);
          const ui=cache.users.findIndex(x=>x.id===user.id); if(ui>=0){cache.users[ui].name=name;cache.users[ui].email=email;if(pass)cache.users[ui].password=pass;}
        }
        await dbAddHistory('seller','Vendedor editado: '+name);
        closeModal();
      }},'Guardar')
    )
  );
}

function modalAddClient(){
  let name='', sellerId='', startDate=today(), notes='';

    h('h2',{},'Nuevo cliente'),
    h('div',{className:'field'},h('label',{},'Nombre / empresa'),h('input',{className:'input',placeholder:'Empresa S.A.',onInput:e=>name=e.target.value})),
    h('div',{className:'field'},h('label',{},'Vendedor'),h('select',{className:'input',onChange:e=>sellerId=e.target.value},
      h('option',{value:''},'Seleccioná un vendedor'),
      ...cache.sellers.map(s=>h('option',{value:s.id},s.name))
    )),
    h('div',{className:'field'},h('label',{},'Fecha de alta'),h('input',{className:'input',type:'date',value:startDate,onInput:e=>startDate=e.target.value})),
    h('div',{className:'field'},h('label',{},'Notas (opcional)'),h('input',{className:'input',placeholder:'...',onInput:e=>notes=e.target.value})),

    h('div',{className:'modal-footer'},
      h('button',{className:'btn',onClick:closeModal},'Cancelar'),
      h('button',{className:'btn btn-green',id:'add-client-btn',onClick:async()=>{
        if(!name||!sellerId){errEl.textContent='Completá nombre y vendedor.';errEl.style.display='block';return;}
        document.getElementById('add-client-btn').disabled=true;
        document.getElementById('add-client-btn').textContent='Guardando...';
        const {data,error}=await sb.from('clients').insert({name,seller_id:sellerId,start_date:startDate,notes:notes||null,status:'active',closing_paid:false}).select().single();
        if(error){errEl.textContent='Error: '+error.message;errEl.style.display='block';document.getElementById('add-client-btn').disabled=false;document.getElementById('add-client-btn').textContent='Guardar';return;}

      h('button',{className:'btn',onClick:closeModal},'Cancelar'),

        const i=cache.clients.findIndex(x=>x.id===c.id); if(i>=0){cache.clients[i].name=name;cache.clients[i].seller_id=sellerId;cache.clients[i].notes=notes;}
        await dbAddHistory('client','Cliente editado: '+name);

function modalAddFee(data){
  let clientId='', amount='', month=data.month||today().slice(0,7);
  const errEl=h('div',{className:'err',style:'display:none'});
  const active=cache.clients.filter(c=>c.status==='active');
  return h('div',{className:'modal'},
    h('h2',{},'Cargar fee mensual (ARS)'),
    h('div',{className:'field'},h('label',{},'Mes'),h('input',{className:'input',type:'month',value:month,onInput:e=>month=e.target.value})),
    h('div',{className:'field'},h('label',{},'Cliente'),h('select',{className:'input',onChange:e=>clientId=e.target.value},
      h('option',{value:''},'Seleccioná cliente'),
      ...active.map(c=>{const s=cache.sellers.find(sl=>sl.id===c.seller_id);return h('option',{value:c.id},c.name+(s?' ('+s.name+')':''));})
    )),
    h('div',{className:'field'},h('label',{},'Monto en ARS ($)'),h('input',{className:'input',type:'number',placeholder:'0',onInput:e=>amount=e.target.value})),
    errEl,
    h('div',{className:'modal-footer'},
      h('button',{className:'btn',onClick:closeModal},'Cancelar'),
      h('button',{className:'btn btn-green',id:'add-fee-btn',onClick:async()=>{
        if(!clientId||!amount||isNaN(Number(amount))){errEl.textContent='Completá todos los campos.';errEl.style.display='block';return;}
        if(cache.fees.find(f=>f.client_id===clientId&&f.month===month)){errEl.textContent='Ya hay un fee para ese cliente en ese mes.';errEl.style.display='block';return;}
        document.getElementById('add-fee-btn').disabled=true;
        document.getElementById('add-fee-btn').textContent='Guardando...';
        const {data,error}=await sb.from('fees').insert({client_id:clientId,month,amount:Number(amount),paid:false}).select().single();
        if(error){errEl.textContent='Error: '+error.message;errEl.style.display='block';document.getElementById('add-fee-btn').disabled=false;document.getElementById('add-fee-btn').textContent='Guardar';return;}
        cache.fees.push(data);
        const cl=cache.clients.find(x=>x.id===clientId);
        await dbAddHistory('fee','Fee cargado: '+(cl?cl.name:'?')+' — '+month+' — '+fmtARS(amount),cl?cl.seller_id:null);
        closeModal();
      }},'Guardar')
    )
  );
}

// ── ACTIONS ───────────────────────────────────────────────
async function toggleClientStatus(c){
  const newStatus=c.status==='active'?'inactive':'active';
  await sb.from('clients').update({status:newStatus}).eq('id',c.id);
  const i=cache.clients.findIndex(x=>x.id===c.id); if(i>=0) cache.clients[i].status=newStatus;
  await dbAddHistory('status','Cliente '+c.name+' → '+(newStatus==='active'?'activo':'inactivo'),c.seller_id);
  render();
}

async function deleteFee(fid){
  if(!confirm('¿Eliminar este fee?')) return;
  await sb.from('fees').delete().eq('id',fid);
  await sb.from('payments').delete().eq('ref','fee_'+fid);
  cache.fees=cache.fees.filter(f=>f.id!==fid);
  cache.payments=cache.payments.filter(p=>p.ref!=='fee_'+fid);
  render();
}

async function deleteSeller(id){
  if(!confirm('¿Eliminar este vendedor y toda su data?')) return;
  const s=cache.sellers.find(x=>x.id===id);
  await sb.from('sellers').delete().eq('id',id);
  cache.sellers=cache.sellers.filter(x=>x.id!==id);
  cache.users=cache.users.filter(x=>x.seller_id!==id);
  await dbAddHistory('seller','Vendedor eliminado: '+(s?s.name:'?'));
  render();
}

// ── UI HELPERS ────────────────────────────────────────────
function metricCard(label,value,color){
  return h('div',{className:'metric'},h('div',{className:'metric-label'},label),h('div',{className:'metric-value'+(color?' '+color:'')},String(value)));
}
function th(t){ return h('th',{},t); }
function td(content){
  const cell=h('td',{});
  if(content==null) return cell;
  if(typeof content==='string'||typeof content==='number') cell.appendChild(document.createTextNode(String(content)));
  else cell.appendChild(content);
  return cell;
}

// ── BOOT ──────────────────────────────────────────────────
render();
</script>
